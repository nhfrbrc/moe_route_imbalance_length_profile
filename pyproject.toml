[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nhfrbrc-moe_route_imbalance_length_profile"
version = "0.1.0"
description = "按段落统计GPU 集群运维工程师·MoE 路由的负载不均相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nhfrbrc" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nhfrbrc.github.io"
Repository = "https://github.com/nhfrbrc/moe_route_imbalance_length_profile"
Issues = "https://github.com/nhfrbrc/moe_route_imbalance_length_profile/issues"

[project.scripts]
moe_route_imbalance_length_profile = "moe_route_imbalance_length_profile:main"

[tool.setuptools]
py-modules = ["moe_route_imbalance_length_profile"]
